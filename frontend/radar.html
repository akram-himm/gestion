<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Radar Overview</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    /* Canvas du radar */
    canvas {
      max-width: 600px;
      margin: 20px auto;
      display: block;
    }
    /* Menu contextuel clic droit : renommer/supprimer */
    #moduleContextMenu {
      display: none;
      position: absolute;
      background-color: white;
      border: 1px solid #ccc;
      padding: 5px;
      z-index: 999;
    }
    /* Menu pour multiples modules sur clic gauche */
    #moduleChoiceMenu {
      display: none;
      position: absolute;
      background-color: white;
      border: 1px solid #ccc;
      padding: 5px;
      z-index: 999;
    }
  </style>
</head>
<body>
  <h1>Radar Overview</h1>

  <canvas id="radarChart" width="600" height="600"></canvas>

  <!-- Création de module -->
  <div>
    <input type="text" id="newModuleName" placeholder="New Module Name" />
    <button id="createModuleBtn">Create Module</button>
  </div>

  <!-- Menu contextuel pour clic droit (rename/delete) -->
  <div id="moduleContextMenu"></div>

  <!-- Menu de choix si plusieurs modules (clic gauche) -->
  <div id="moduleChoiceMenu"></div>

  <script src="script_radar.js"></script>
</body>
</html>
